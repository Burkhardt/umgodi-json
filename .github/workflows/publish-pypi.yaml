name: Publish umgodi-json to PyPI
on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Immutable Git release (in the form vX.Y.Z)
        type: string
        required: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.release_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify tag and package version
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
        run: |
          python - <<'PY'
          import os, re, subprocess, tomllib
          ref = os.environ['RELEASE_REF']
          with open('pyproject.toml', 'rb') as stream:
              project = tomllib.load(stream)['project']
          if project['name'] != 'umgodi-json':
              raise SystemExit('unexpected distribution name')
          if not re.fullmatch(r'v\d+\.\d+\.\d+', ref) or ref != 'v' + project['version']:
              raise SystemExit('release_ref must equal the package version tag')
          tag = subprocess.check_output(['git', 'rev-parse', 'refs/tags/' + ref + '^{}'], text=True).strip()
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if tag != head or os.environ['GITHUB_SHA'] != head or os.environ['GITHUB_REF'] != 'refs/tags/' + ref:
              raise SystemExit('checkout does not match the immutable tag')
          PY
      - run: python -m pip install '.[dev]' build twine
      - name: Install Amafu
        run: curl -fsSL https://raw.githubusercontent.com/Burkhardt/RAIkeep/main/scripts/InstallAmafu.sh | sudo bash -s -- native 4.7.0
      - run: python -m pytest -q -rs
      - run: python -m build --outdir dist
      - run: python -m twine check dist/*
      - name: Verify installed wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/wheel-check"
          check="$RUNNER_TEMP/wheel-check/bin"
          "$check/python" -m pip install dist/*.whl
          "$check/python" -m pip check
          cd "$RUNNER_TEMP"
          "$check/python" -I -c "import umgodi"
          "$check/jpit" --version
          "$check/umgodi" --version
      - uses: actions/upload-artifact@v4
        with:
          name: umgodi-json-distributions
          path: dist/*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/umgodi-json/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: umgodi-json-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
