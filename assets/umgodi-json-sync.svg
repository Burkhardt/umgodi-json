<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Canvas subtle gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11110F"/>
      <stop offset="100%" stop-color="#1E1E1A"/>
    </linearGradient>

    <!-- Warm African Ochre & eGoli Gold Tinctures -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE496"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA8214"/>
    </linearGradient>

    <linearGradient id="shadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DCA832"/>
      <stop offset="50%" stop-color="#B88219"/>
      <stop offset="100%" stop-color="#7D5508"/>
    </linearGradient>

    <linearGradient id="goldRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF2BD"/>
      <stop offset="100%" stop-color="#C59B27"/>
    </linearGradient>

    <!-- Drop Shadow for Dimensional Separation -->
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Solid Sculpted Orbital Chevron Arrow -->
    <marker id="arrowSolid" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <polygon points="0,1 5,3.5 0,6" fill="#FCE496"/>
    </marker>
  </defs>

  <!-- Dark Obsidian Base Ground -->
  <rect width="512" height="512" rx="104" fill="url(#bg)"/>

  <!-- Subtle Atmospheric Precision Rings -->
  <circle cx="256" cy="256" r="222" fill="none" stroke="#25251F" stroke-width="1.5" stroke-dasharray="4 8"/>
  <circle cx="256" cy="256" r="184" fill="none" stroke="#33332A" stroke-width="1.2"/>

  <!-- CONTINUOUS SYNCHRONIZATION ORBITS WITH SOLID CHEVRONS -->
  <g fill="none" opacity="0.92">
    <!-- Top-Right Orbital Quadrant (12 to 3 o'clock) -->
    <path d="M 256,86 C 350,86 426,162 426,256" 
          stroke="url(#gold)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="14 10" marker-end="url(#arrowSolid)"/>

    <!-- Bottom-Right Orbital Quadrant (3 to 6 o'clock) -->
    <path d="M 426,256 C 426,350 350,426 256,426" 
          stroke="url(#shadow)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="14 10" marker-end="url(#arrowSolid)"/>

    <!-- Bottom-Left Orbital Quadrant (6 to 9 o'clock) -->
    <path d="M 256,426 C 162,426 86,350 86,256" 
          stroke="url(#gold)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="14 10" marker-end="url(#arrowSolid)"/>

    <!-- Top-Left Orbital Quadrant (9 to 12 o'clock) -->
    <path d="M 86,256 C 86,162 162,86 256,86" 
          stroke="url(#shadow)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="14 10" marker-end="url(#arrowSolid)"/>
  </g>

  <!-- FOUR CARDINAL REPLICATION NODES (Optically Calibrated) -->
  <!-- Subtle halo behind each node to eliminate visual clutter -->
  <g fill="#141412" stroke="#AA8214" stroke-width="1.5">
    <!-- North Node (12 o'clock) -->
    <circle cx="256" cy="86" r="15"/>
    <!-- East Node (3 o'clock) -->
    <circle cx="426" cy="256" r="15"/>
    <!-- South Node (6 o'clock) -->
    <circle cx="256" cy="426" r="15"/>
    <!-- West Node (9 o'clock) -->
    <circle cx="86" cy="256" r="15"/>
  </g>

  <!-- Calçada White Inner Rings & Gilded Cores -->
  <g fill="none" stroke="#F4F4F0" stroke-width="2">
    <circle cx="256" cy="86" r="10"/>
    <circle cx="426" cy="256" r="10"/>
    <circle cx="256" cy="426" r="10"/>
    <circle cx="86" cy="256" r="10"/>
  </g>
  <g fill="#FCE496">
    <circle cx="256" cy="86" r="4.5"/>
    <circle cx="426" cy="256" r="4.5"/>
    <circle cx="256" cy="426" r="4.5"/>
    <circle cx="86" cy="256" r="4.5"/>
  </g>

  <!-- CENTRAL UMGODI CARTOUCHE BRACKET { } & SUBTERRANEAN STRATA VAULT -->
  <g filter="url(#glow)">

    <!-- Left Bracket Wing (Sunlit Gold) -->
    <path d="M 230,126 
             C 176,126 154,156 154,204 
             L 154,224 
             C 154,244 132,256 118,256 
             C 132,256 154,268 154,288 
             L 154,308 
             C 154,356 176,386 230,386 
             L 256,386 
             L 256,126 Z" 
          fill="url(#gold)" stroke="#AA8214" stroke-width="2"/>

    <!-- Right Bracket Wing (Shadowed Gold) -->
    <path d="M 282,126 
             C 336,126 358,156 358,204 
             L 358,224 
             C 358,244 380,256 394,256 
             C 380,256 358,268 358,288 
             L 358,308 
             C 358,356 336,386 282,386 
             L 256,386 
             L 256,126 Z" 
          fill="url(#shadow)" stroke="#7D5508" stroke-width="2"/>

    <!-- SUBTERRANEAN STRATA CAVITY (The Deep Pit Chamber) -->
    <ellipse cx="256" cy="256" rx="72" ry="98" fill="#0E0E0C" stroke="#4A3406" stroke-width="2.5"/>

    <!-- THREE GEOLOGICAL DELTA STRATA PLATES (Conforming to Pit Curvature) -->
    <!-- Strata 1 (Upper) -->
    <path d="M 200,214 C 218,206 294,206 312,214 L 306,227 C 290,221 222,221 206,227 Z" 
          fill="url(#gold)" opacity="0.95"/>

    <!-- Strata 2 (Center Horizon, enclosing state core) -->
    <path d="M 194,249 C 212,243 300,243 318,249 L 316,263 C 298,257 214,257 196,263 Z" 
          fill="url(#gold)" opacity="0.95"/>

    <!-- Strata 3 (Lower) -->
    <path d="M 204,285 C 220,291 292,291 308,285 L 302,298 C 288,304 224,304 210,298 Z" 
          fill="url(#gold)" opacity="0.95"/>

    <!-- THE LIVING PROJECTION NEXUS (Immutable State Core) -->
    <circle cx="256" cy="256" r="23" fill="#141412" stroke="url(#goldRim)" stroke-width="3"/>
    <circle cx="256" cy="256" r="7" fill="#F4F4F0"/>

  </g>
</svg>