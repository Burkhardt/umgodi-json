<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Canvas Subtle Deep Obsidian Gradient -->
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11110F"/>
      <stop offset="100%" stop-color="#1A1A16"/>
    </linearGradient>

    <!-- Warm African Ochre & eGoli Gold -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE496"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA8214"/>
    </linearGradient>

    <linearGradient id="shadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DCA832"/>
      <stop offset="50%" stop-color="#B88219"/>
      <stop offset="100%" stop-color="#7D5508"/>
    </linearGradient>

    <linearGradient id="goldRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF2BD"/>
      <stop offset="100%" stop-color="#C59B27"/>
    </linearGradient>

    <filter id="bannerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <marker id="arrowSolid" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <polygon points="0,1 5,3.5 0,6" fill="#FCE496"/>
    </marker>
  </defs>

  <!-- Banner Ground with Apple Squircle Continuous Curvature -->
  <rect width="1200" height="420" rx="48" fill="url(#bannerBg)"/>

  <!-- Left Accent Bicolor Seam (Cascais Castle Red to Heraldic Green) -->
  <rect x="0" y="70" width="6" height="140" fill="#D22B2B"/>
  <rect x="0" y="210" width="6" height="140" fill="#1E5631"/>

  <!-- INLINED UMGODI-JSON VECTOR MARK (Zero External Image Dependency) -->
  <g transform="translate(68, 50) scale(0.625)" filter="url(#bannerGlow)">
    <!-- Squircle Ground for Icon (512x512 scaled to 320x320) -->
    <rect width="512" height="512" rx="104" fill="#141412" stroke="#282822" stroke-width="2"/>
    <circle cx="256" cy="256" r="222" fill="none" stroke="#25251F" stroke-width="1.5" stroke-dasharray="4 8"/>
    <circle cx="256" cy="256" r="184" fill="none" stroke="#33332A" stroke-width="1.2"/>

    <!-- Orbital Sync Streams -->
    <g fill="none" opacity="0.92">
      <path d="M 256,86 C 350,86 426,162 426,256" stroke="url(#gold)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="14 10" marker-end="url(#arrowSolid)"/>
      <path d="M 426,256 C 426,350 350,426 256,426" stroke="url(#shadow)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="14 10" marker-end="url(#arrowSolid)"/>
      <path d="M 256,426 C 162,426 86,350 86,256" stroke="url(#gold)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="14 10" marker-end="url(#arrowSolid)"/>
      <path d="M 86,256 C 86,162 162,86 256,86" stroke="url(#shadow)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="14 10" marker-end="url(#arrowSolid)"/>
    </g>

    <!-- Cardinal Nodes -->
    <g fill="#141412" stroke="#AA8214" stroke-width="1.5">
      <circle cx="256" cy="86" r="15"/>
      <circle cx="426" cy="256" r="15"/>
      <circle cx="256" cy="426" r="15"/>
      <circle cx="86" cy="256" r="15"/>
    </g>
    <g fill="none" stroke="#F4F4F0" stroke-width="2">
      <circle cx="256" cy="86" r="10"/>
      <circle cx="426" cy="256" r="10"/>
      <circle cx="256" cy="426" r="10"/>
      <circle cx="86" cy="256" r="10"/>
    </g>
    <g fill="#FCE496">
      <circle cx="256" cy="86" r="4.5"/>
      <circle cx="426" cy="256" r="4.5"/>
      <circle cx="256" cy="426" r="4.5"/>
      <circle cx="86" cy="256" r="4.5"/>
    </g>

    <!-- Cartouche Brackets -->
    <path d="M 230,126 C 176,126 154,156 154,204 L 154,224 C 154,244 132,256 118,256 C 132,256 154,268 154,288 L 154,308 C 154,356 176,386 230,386 L 256,386 L 256,126 Z" fill="url(#gold)" stroke="#AA8214" stroke-width="2"/>
    <path d="M 282,126 C 336,126 358,156 358,204 L 358,224 C 358,244 380,256 394,256 C 380,256 358,268 358,288 L 358,308 C 358,356 336,386 282,386 L 256,386 L 256,126 Z" fill="url(#shadow)" stroke="#7D5508" stroke-width="2"/>

    <!-- Inner Cavity -->
    <ellipse cx="256" cy="256" rx="72" ry="98" fill="#0E0E0C" stroke="#4A3406" stroke-width="2.5"/>

    <!-- Strata Plates -->
    <path d="M 200,214 C 218,206 294,206 312,214 L 306,227 C 290,221 222,221 206,227 Z" fill="url(#gold)" opacity="0.95"/>
    <path d="M 194,249 C 212,243 300,243 318,249 L 316,263 C 298,257 214,257 196,263 Z" fill="url(#gold)" opacity="0.95"/>
    <path d="M 204,285 C 220,291 292,291 308,285 L 302,298 C 288,304 224,304 210,298 Z" fill="url(#gold)" opacity="0.95"/>

    <!-- State Core -->
    <circle cx="256" cy="256" r="23" fill="#141412" stroke="url(#goldRim)" stroke-width="3"/>
    <circle cx="256" cy="256" r="7" fill="#F4F4F0"/>
  </g>

  <!-- ORIGINAL AUTHORITATIVE TYPOGRAPHY & COPY -->
  <g font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    
    <!-- Package Eyebrow Pill -->
    <g transform="translate(426, 76)">
      <rect width="136" height="24" rx="4" fill="#20201A" stroke="#38382E" stroke-width="1"/>
      <text x="10" y="16" font-size="10.5" font-weight="700" fill="#D4AF37" letter-spacing="2" font-family="'JetBrains Mono', monospace">PYPI PACKAGE</text>
    </g>

    <!-- Main Title Logotype: UMGODI -->
    <text x="426" y="166" font-size="58" font-weight="800" fill="#F4F4F0" letter-spacing="5">UMGODI</text>

    <!-- Subtitle: JSON · DISTRIBUTED STATE -->
    <text x="428" y="218" font-size="22" font-weight="700" fill="#D4AF37" letter-spacing="6">JSON · DISTRIBUTED STATE</text>

    <!-- Narrative Tagline: One durable pit. Many machines. Synchronized history. -->
    <text x="428" y="268" font-size="19" font-weight="500" fill="#C8C8B8" letter-spacing="0.5">
      One durable pit. Many machines. Synchronized history.
    </text>

    <!-- Terminal Code Chip: pip install umgodi-json -->
    <g transform="translate(428, 308)">
      <rect width="320" height="42" rx="6" fill="#151512" stroke="#36362C" stroke-width="1.2"/>
      <text x="18" y="26" font-size="14" font-weight="600" fill="#8E8E80" font-family="'JetBrains Mono', monospace">$</text>
      <text x="36" y="26" font-size="14" font-weight="600" fill="#FCE496" font-family="'JetBrains Mono', monospace">pip install umgodi-json</text>
    </g>

    <!-- Decorative Sync Hash Line -->
    <line x1="772" y1="329" x2="1136" y2="329" stroke="url(#gold)" stroke-width="2" stroke-linecap="round" stroke-dasharray="14 10"/>
  </g>
</svg>