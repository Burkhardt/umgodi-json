[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "umgodi-json"
version = "4.7.2"
description = "Distributed, cloud-drive-backed JSON persistence for Python with immutable history and multi-process synchronization."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
	{ name = "Dr. Rainer Burkhardt" },
]
classifiers = [
	"Development Status :: 5 - Production/Stable",
	"Intended Audience :: Developers",
	"Operating System :: OS Independent",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3.12",
	"Programming Language :: Python :: 3.13",
	"Topic :: Database :: Database Engines/Servers",
	"Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["inqaba>=4.7.2"]

[project.scripts]
jpit = "umgodi.cli:main"
umgodi = "umgodi.cli:main"

[project.optional-dependencies]
dev = [
	"pytest>=8.0",
	"pytest-cov>=5.0",
	"mypy>=1.10",
	"ruff>=0.5",
	"vikela[pylint]==4.7.2",
]

[project.urls]
Repository = "https://github.com/Burkhardt/umgodi-json"
ReleaseNotes = "https://github.com/Burkhardt/RAIkeep/blob/main/doc/releases/v4.x/umgodi-json_RELEASE_NOTES_4.x.md"

[tool.hatch.build.targets.wheel]
packages = ["umgodi"]

[tool.hatch.build.targets.sdist]
only-include = [
	"umgodi",
	"conftest.py",
	"README.md",
	"API.md",
	"GettingStarted.md",
	"pyproject.toml",
	"assets",
	"doc",
	"tests",
	"scripts",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF"]

[tool.ruff.format]
indent-style = "tab"
quote-style = "double"

[tool.vikela]
disable = []
